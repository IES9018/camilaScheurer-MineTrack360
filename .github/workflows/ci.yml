name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Evita que el script "prepare" instale los hooks de husky en CI
      HUSKY: "0"
    steps:
      - name: Checkout
        # Acción oficial de GitHub: descarga el código del repositorio en el runner
        uses: actions/checkout@v7

      # Node 24: Jest 30 necesita >= 24.9 para cargar @nestjs/testing (ESM)
      - name: Setup Node.js
        # Acción oficial de GitHub: instala Node 24 y cachea npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Tests unitarios con cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build

      # Falla si aparece una vulnerabilidad alta o crítica en dependencias de producción
      - name: Auditoría de dependencias (producción)
        run: node scripts/audit-gate.mjs

  contract:
    name: Contrato OpenAPI (lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Acción oficial de GitHub: descarga el código del repositorio en el runner
        uses: actions/checkout@v7

      - name: Setup Node.js
        # Acción oficial de GitHub: instala Node 24
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # El contrato es la fuente de verdad de la API (R-09). Herramienta externa: se ejecuta
      # con npx fijando la versión y NO es dependencia del proyecto (R-07).
      - name: Lint del contrato
        run: npx --yes @redocly/cli@2.77.0 lint docs/arquitectura/api-contracts.yaml

  frontend:
    name: Frontend (typecheck, lint, formato, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        # Acción oficial de GitHub: descarga el código del repositorio en el runner
        uses: actions/checkout@v7

      - name: Setup Node.js
        # Acción oficial de GitHub: instala Node 24 y cachea npm
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Formato
        run: npm run format:check

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # Presupuesto de JavaScript inicial < 200 KB gzip (RNF-13, ADR-007)
      - name: Presupuesto de peso del JavaScript
        run: npm run check:bundle

      - name: Auditoría de dependencias (producción)
        run: npm audit --omit=dev --audit-level=high
