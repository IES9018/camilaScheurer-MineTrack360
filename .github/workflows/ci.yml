name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck, lint, test, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Evita que el script "prepare" instale los hooks de husky en CI
      HUSKY: "0"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Node 24: Jest 30 necesita >= 24.9 para cargar @nestjs/testing (ESM)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint:check

      - name: Tests unitarios con cobertura
        run: npm run test:cov

      - name: Build
        run: npm run build
