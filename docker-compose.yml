services:
  # Base de datos relacional + extensión de series temporales,
  # según Sección 3.3 y 7.1 del informe.
  db:
    image: timescale/timescaledb:latest-pg16
    container_name: minetrack360-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Cache de consultas frecuentes y broker auxiliar de colas (BullMQ).
  redis:
    image: redis:7-alpine
    container_name: minetrack360-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  # Broker MQTT para la ingesta de telemetría IoT (patrón Pub/Sub).
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: minetrack360-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log

  # Contenedor de desarrollo: acá es donde VS Code se va a "meter" a programar.
  # No es un servicio del stack de producción, es nuestro entorno de trabajo.
  backend-dev:
    image: node:24-bookworm
    container_name: minetrack360-backend-dev
    restart: unless-stopped
    command: sleep infinity
    working_dir: /workspace
    volumes:
      - .:/workspace
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - MQTT_URL=${MQTT_URL}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
    ports:
      - "3000:3000"
    depends_on:
      - db
      - redis
      - mosquitto

  # Contenedor de desarrollo del frontend (Vite + React + Tailwind, ADR-004).
  # Igual que backend-dev: no es un servicio de producción, es el entorno donde
  # se ejecuta el toolchain Node (SPEC R-06). Uso:
  #   docker compose exec frontend-dev npm ci
  #   docker compose exec frontend-dev npm run dev     -> http://localhost:5173
  frontend-dev:
    image: node:24-bookworm
    container_name: minetrack360-frontend-dev
    restart: unless-stopped
    command: sleep infinity
    working_dir: /workspace/frontend
    volumes:
      - .:/workspace
      # node_modules vive en un volumen de Docker y no en la carpeta del proyecto:
      # es más rápido y evita que OneDrive sincronice miles de archivos
      - frontend_node_modules:/workspace/frontend/node_modules
    environment:
      # El proxy de Vite reenvía /api al backend por la red de Docker
      - VITE_API_PROXY_TARGET=http://backend-dev:3000
      # Las carpetas montadas desde Windows no avisan cambios: se usa polling
      - VITE_USE_POLLING=true
    ports:
      - "5173:5173"
    depends_on:
      - backend-dev

volumes:
  db_data:
  frontend_node_modules:
  mosquitto_data:
  mosquitto_log:

# NOTA: el servicio "api" de producción (con su propio Dockerfile multi-stage) y
# el empaquetado del frontend para despliegue se agregarán en las etapas de
# despliegue; backend-dev y frontend-dev son solo entornos de codificación.
