# Puerto estándar MQTT
listener 1883

# Para el prototipo académico permitimos conexiones sin autenticación.
# En un entorno de producción real, esto se reemplazaría por un archivo
# de contraseñas (password_file) y TLS (Sección 7.2 del informe menciona
# HiveMQ Cloud con credenciales TLS para producción).
allow_anonymous true

# Persistencia de mensajes retenidos en disco
persistence true
persistence_location /mosquitto/data/

# Logs del broker
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout