openapi: 3.0.3
info:
  title: MineTrack360 API
  version: 1.0.0
  description: |
    Contrato de la API REST de MineTrack360 (TP4: contratos antes que código).

    **Este archivo es la fuente de verdad.** Todo cambio de endpoint empieza aquí,
    en un PR, y después se implementa (regla del arnés `.opencoderules` v3, ADR-005).

    Cubre los 13 endpoints implementados. Los 5 críticos de los journeys del TP3
    (`docs/diseno/usuarios.md`) son: iniciar sesión, ver las alertas de mantenimiento (P1)
    y asignar un turno (P2: consultar disponibilidad, asignar y deshacer). Los otros 8
    (usuario actual, vehículos, operadores, evaluación y umbrales de mantenimiento)
    se incorporaron después (N-14).

    Autenticación: token JWT (HS256) en `Authorization: Bearer <token>`, emitido por
    `POST /api/v1/auth/login`. Los roles son `admin`, `supervisor`, `mantenimiento`,
    `hse` y `lectura`; cada operación declara los permitidos en `x-roles`.
  license:
    name: Proyecto académico (IES 9018, PP3/ADI 2026)
    url: https://github.com/IES9018/camilaScheurer-MineTrack360
servers:
  - url: /
    description: |
      Mismo origen que el frontend. En desarrollo, el proxy de Vite reenvía `/api` al
      backend (`http://backend-dev:3000`); el backend también escucha en el puerto 3000.
tags:
  - name: auth
    description: Autenticación y emisión del token JWT (RF-01)
  - name: maintenance
    description: Alertas de mantenimiento preventivo (RF-05, pantalla P1)
  - name: shifts
    description: Asignación de vehículos y operadores a turnos (RF-07, pantalla P2)
  - name: vehicles
    description: Flota de vehículos
  - name: operators
    description: Operadores (choferes) que se asignan a los turnos
security:
  - bearerAuth: []
paths:
  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Iniciar sesión y obtener un token JWT
      description: |
        Limitado a **5 intentos por minuto por IP** (respuesta 429 al excederlo).
        Ante cualquier falla de credenciales (email inexistente, contraseña incorrecta
        o usuario inactivo) devuelve el mismo mensaje, para no revelar qué dato falló.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: Credenciales inválidas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                statusCode: 401
                message: Credenciales inválidas
                error: Unauthorized
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/maintenance/alerts:
    get:
      tags: [maintenance]
      operationId: getFleetAlerts
      summary: Alertas de mantenimiento de toda la flota, ordenadas por criticidad
      description: |
        Una fila por vehículo, de lo más urgente a lo menos urgente
        (`CRITICAL`, `WARNING`, `NO_THRESHOLD`, `OK`). El estado sale de comparar las
        horas desde el último servicio con el intervalo del tipo de vehículo:
        `WARNING` desde el 90 % y `CRITICAL` desde el 100 % (CA-03).
        `NO_THRESHOLD` indica que el tipo todavía no tiene intervalo configurado.
      x-roles: [admin, supervisor, mantenimiento]
      responses:
        '200':
          description: Listado de alertas (vacío si no hay vehículos)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FleetAlert'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/shifts/availability:
    get:
      tags: [shifts]
      operationId: getShiftAvailability
      summary: Disponibilidad de vehículos y operadores para una fecha y turno
      description: |
        Devuelve todos los vehículos y operadores activos y, para los que no se pueden
        asignar, el motivo (`reason`). Un vehículo con alerta `CRITICAL` figura como
        `CRITICAL_ALERT`.
      x-roles: [admin, supervisor]
      parameters:
        - name: date
          in: query
          required: true
          description: Fecha del turno, formato AAAA-MM-DD
          schema:
            type: string
            format: date
            pattern: '^\d{4}-\d{2}-\d{2}$'
            example: '2026-11-13'
        - name: shift
          in: query
          required: true
          description: Turno
          schema:
            $ref: '#/components/schemas/ShiftType'
      responses:
        '200':
          description: Disponibilidad del turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAvailability'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/shifts/assignments:
    post:
      tags: [shifts]
      operationId: assignShift
      summary: Asignar un vehículo y un operador a un turno
      description: |
        Rechaza la asignación si el vehículo no está activo o tiene alerta `CRITICAL`,
        si el operador no está activo, o si el vehículo o el operador ya están
        asignados en ese turno (409). La unicidad la garantiza la base de datos, así que
        dos pedidos simultáneos nunca generan una doble asignación.
      x-roles: [admin, supervisor]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignShiftRequest'
      responses:
        '201':
          description: Asignación creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El vehículo o el operador no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            Vehículo inactivo o con alerta crítica, operador inactivo, o vehículo u
            operador ya asignados en ese turno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/shifts/assignments/{id}/cancel:
    patch:
      tags: [shifts]
      operationId: cancelShiftAssignment
      summary: Cancelar (deshacer) una asignación
      description: |
        Cambia el estado a `CANCELLED` y libera el vehículo y el operador para ese turno.
        No borra el registro.
      x-roles: [admin, supervisor]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la asignación
          schema:
            type: integer
            minimum: 1
            example: 17
      responses:
        '200':
          description: Asignación cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShiftAssignment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: La asignación no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: La asignación ya estaba cancelada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/auth/me:
    get:
      tags: [auth]
      operationId: getCurrentUser
      summary: Datos del token del usuario autenticado
      description: |
        Devuelve los datos firmados dentro del token (no consulta la base de datos).
        Sirve para comprobar que la sesión sigue vigente.
      x-roles: [admin, supervisor, mantenimiento, hse, lectura]
      responses:
        '200':
          description: Datos del token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenClaims'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/vehicles:
    get:
      tags: [vehicles]
      operationId: listVehicles
      summary: Listar todos los vehículos
      x-roles: [admin, supervisor, mantenimiento, hse, lectura]
      responses:
        '200':
          description: Todos los vehículos (vacío si no hay)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Vehicle'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [vehicles]
      operationId: createVehicle
      summary: Registrar un vehículo nuevo
      description: |
        Rechaza con 400 un tipo de vehículo inexistente o `lastServiceHours` mayor que
        `totalEngineHours`, y con 409 un código interno o una patente ya usados.
        Los tipos de vehículo no se crean por la API (se cargan en la base).
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateVehicleRequest'
      responses:
        '201':
          description: Vehículo creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El código interno o la patente ya están en uso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/vehicles/{id}:
    get:
      tags: [vehicles]
      operationId: getVehicle
      summary: Obtener un vehículo por id
      x-roles: [admin, supervisor, mantenimiento, hse, lectura]
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador del vehículo
          schema:
            type: integer
            example: 14
      responses:
        '200':
          description: El vehículo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Vehicle'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El vehículo no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/maintenance/threshold-evaluation:
    post:
      tags: [maintenance]
      operationId: evaluateThreshold
      summary: Evaluar el estado de mantenimiento según las horas de uso
      description: |
        Cálculo puro, sin consultar ni guardar datos. `hoursSinceService` se redondea a
        un decimal; `OK` por debajo del 90 % del intervalo, `WARNING` desde el 90 % y
        `CRITICAL` desde el 100 %. Responde **200** (no 201) porque no crea nada.
      x-roles: [admin, supervisor, mantenimiento]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EvaluateThresholdRequest'
      responses:
        '200':
          description: Resultado de la evaluación
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ThresholdEvaluation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/maintenance/thresholds/{vehicleTypeId}:
    put:
      tags: [maintenance]
      operationId: setMaintenanceThreshold
      summary: Definir o actualizar el intervalo de servicio de un tipo de vehículo
      description: Crea el intervalo si no existía o lo reemplaza. Cambia el estado que calcula `GET /api/v1/maintenance/alerts`.
      x-roles: [admin]
      parameters:
        - name: vehicleTypeId
          in: path
          required: true
          description: Identificador del tipo de vehículo
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetThresholdRequest'
      responses:
        '200':
          description: Intervalo vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceThreshold'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: El tipo de vehículo no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/v1/operators:
    get:
      tags: [operators]
      operationId: listOperators
      summary: Listar operadores
      x-roles: [admin, supervisor]
      responses:
        '200':
          description: Todos los operadores (vacío si no hay)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Operator'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      tags: [operators]
      operationId: createOperator
      summary: Registrar un operador
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOperatorRequest'
      responses:
        '201':
          description: Operador creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Operator'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: El legajo ya existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT (HS256) obtenido en `POST /api/v1/auth/login`; vence a la hora (valor por defecto de `JWT_EXPIRES_IN`, ADR-006)
  responses:
    BadRequest:
      description: |
        Datos inválidos: campos faltantes, con formato incorrecto o que el contrato no
        declara (la API rechaza las propiedades de más). `message` es una lista con un
        texto por cada problema.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 400
            message:
              - vehicleId must be an integer number
            error: Bad Request
    Unauthorized:
      description: Falta el token, es inválido o está vencido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 401
            message: Token de acceso requerido
            error: Unauthorized
    Forbidden:
      description: El rol del usuario no tiene permiso para esta operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 403
            message: Permisos insuficientes para acceder a este recurso
            error: Forbidden
    TooManyRequests:
      description: >-
        Se superó el límite de pedidos por IP: 5 por minuto en el login y
        100 por minuto en el resto de la API.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 429
            message: 'ThrottlerException: Too Many Requests'
    InternalError:
      description: Error inesperado del servidor; no se informan detalles internos
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            statusCode: 500
            message: Internal server error
  schemas:
    ErrorResponse:
      type: object
      description: Formato de error de NestJS
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          example: 409
        message:
          description: Un texto, o una lista de textos cuando hay varios errores de validación
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: Nombre del estado HTTP
          example: Conflict
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          description: Se normaliza (sin espacios y en minúsculas) antes de validarse
          example: supervisor@minetrack360.com
        password:
          type: string
          maxLength: 72
          minLength: 1
          description: Máximo 72 caracteres (límite de bcrypt)
          example: ContraseñaSegura123
    UserRole:
      type: string
      enum: [admin, supervisor, mantenimiento, hse, lectura]
    LoginResponse:
      type: object
      required: [accessToken, user]
      properties:
        accessToken:
          type: string
          description: Token JWT firmado (HS256)
        user:
          type: object
          required: [id, fullName, email, role]
          properties:
            id:
              type: integer
              example: 3
            fullName:
              type: string
              example: Ana Pérez
            email:
              type: string
              format: email
            role:
              $ref: '#/components/schemas/UserRole'
    FleetAlertStatus:
      type: string
      description: |
        Estado de mantenimiento de un vehículo: `CRITICAL` desde el 100 % del intervalo,
        `WARNING` desde el 90 %, `OK` por debajo, `NO_THRESHOLD` si su tipo no tiene
        intervalo configurado.
      enum: [CRITICAL, WARNING, NO_THRESHOLD, OK]
    VehicleStatus:
      type: string
      description: Estado operativo del vehículo
      enum: [ACTIVE, MAINTENANCE, OUT_OF_SERVICE]
    FleetAlert:
      type: object
      required:
        - vehicleId
        - internalCode
        - vehicleTypeName
        - vehicleStatus
        - totalEngineHours
        - lastServiceHours
        - hoursSinceService
        - intervalHours
        - ratio
        - status
      properties:
        vehicleId:
          type: integer
          example: 14
        internalCode:
          type: string
          example: CAM-014
        vehicleTypeName:
          type: string
          example: Camión fuera de ruta
        vehicleStatus:
          $ref: '#/components/schemas/VehicleStatus'
        totalEngineHours:
          type: number
          example: 1005
        lastServiceHours:
          type: number
          example: 500
        hoursSinceService:
          type: number
          description: Horas de uso desde el último servicio
          example: 505
        intervalHours:
          type: number
          nullable: true
          description: Intervalo del tipo de vehículo; `null` si no está configurado
          example: 500
        ratio:
          type: number
          nullable: true
          description: Proporción consumida del intervalo (1 = 100 %); `null` si no hay intervalo
          example: 1.01
        status:
          $ref: '#/components/schemas/FleetAlertStatus'
    ShiftType:
      type: string
      description: Turno (mañana, tarde, noche)
      enum: [MORNING, AFTERNOON, NIGHT]
    VehicleAvailability:
      type: object
      required: [vehicleId, internalCode, vehicleTypeName, available, reason, assignedTo]
      properties:
        vehicleId:
          type: integer
        internalCode:
          type: string
          example: CAM-021
        vehicleTypeName:
          type: string
          example: Camión fuera de ruta
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [NOT_ACTIVE, CRITICAL_ALERT, ALREADY_ASSIGNED, null]
          description: |
            Por qué no se puede asignar: no está activo (`NOT_ACTIVE`), tiene una alerta
            crítica de mantenimiento (`CRITICAL_ALERT`) o ya está asignado en ese turno
            (`ALREADY_ASSIGNED`). `null` cuando está disponible.
        assignedTo:
          type: string
          nullable: true
          description: Nombre del operador asignado en ese turno, si ya está asignado
    OperatorAvailability:
      type: object
      required: [operatorId, fullName, employeeCode, available, reason, assignedTo]
      properties:
        operatorId:
          type: integer
        fullName:
          type: string
          example: Juan Pérez
        employeeCode:
          type: string
          description: Legajo
          example: OP-0001
        available:
          type: boolean
        reason:
          type: string
          nullable: true
          enum: [ALREADY_ASSIGNED, null]
          description: "`ALREADY_ASSIGNED` si ya está asignado en ese turno; `null` si está disponible"
        assignedTo:
          type: string
          nullable: true
          description: Código del vehículo asignado en ese turno, si ya está asignado
    ShiftAvailability:
      type: object
      required: [date, shift, vehicles, operators]
      properties:
        date:
          type: string
          format: date
          example: '2026-11-13'
        shift:
          $ref: '#/components/schemas/ShiftType'
        vehicles:
          type: array
          items:
            $ref: '#/components/schemas/VehicleAvailability'
        operators:
          type: array
          items:
            $ref: '#/components/schemas/OperatorAvailability'
    AssignShiftRequest:
      type: object
      additionalProperties: false
      required: [vehicleId, operatorId, date, shift]
      properties:
        vehicleId:
          type: integer
          minimum: 1
          example: 21
        operatorId:
          type: integer
          minimum: 1
          example: 5
        date:
          type: string
          format: date
          pattern: '^\d{4}-\d{2}-\d{2}$'
          description: Fecha del turno, formato AAAA-MM-DD
          example: '2026-11-13'
        shift:
          $ref: '#/components/schemas/ShiftType'
    ShiftAssignmentStatus:
      type: string
      enum: [ASSIGNED, CANCELLED]
    ShiftAssignment:
      type: object
      required: [id, vehicleId, operatorId, date, shift, status, assignedById, createdAt, cancelledAt, cancelledById]
      properties:
        id:
          type: integer
          example: 17
        vehicleId:
          type: integer
        operatorId:
          type: integer
        date:
          type: string
          format: date
          example: '2026-11-13'
        shift:
          $ref: '#/components/schemas/ShiftType'
        status:
          $ref: '#/components/schemas/ShiftAssignmentStatus'
        assignedById:
          type: integer
          description: Usuario que creó la asignación
        createdAt:
          type: string
          format: date-time
        cancelledAt:
          type: string
          format: date-time
          nullable: true
        cancelledById:
          type: integer
          nullable: true
          description: >-
            Id del usuario que canceló. Es null mientras la asignación está
            activa y en las canceladas antes de que se registrara este dato.
    TokenClaims:
      type: object
      description: Datos firmados dentro del token JWT
      required: [sub, email, role]
      properties:
        sub:
          type: integer
          description: Id del usuario
          example: 3
        email:
          type: string
          format: email
        role:
          $ref: '#/components/schemas/UserRole'
        iat:
          type: integer
          description: Momento de emisión (segundos desde 1970)
        exp:
          type: integer
          description: Momento de vencimiento (segundos desde 1970)
    VehicleType:
      type: object
      required: [id, name, category]
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Camión fuera de ruta
        category:
          type: string
          example: Transporte
    Vehicle:
      type: object
      required: [id, internalCode, licensePlate, vehicleType, totalEngineHours, lastServiceHours, status, createdAt]
      properties:
        id:
          type: integer
          example: 14
        internalCode:
          type: string
          example: CAM-014
        licensePlate:
          type: string
          example: AB123CD
        vehicleType:
          $ref: '#/components/schemas/VehicleType'
        totalEngineHours:
          type: number
          example: 1005
        lastServiceHours:
          type: number
          example: 500
        status:
          $ref: '#/components/schemas/VehicleStatus'
        createdAt:
          type: string
          format: date-time
    CreateVehicleRequest:
      type: object
      additionalProperties: false
      required: [internalCode, licensePlate, vehicleTypeId]
      properties:
        internalCode:
          type: string
          minLength: 1
          maxLength: 50
          description: Código interno único
          example: CAM-001
        licensePlate:
          type: string
          minLength: 1
          maxLength: 20
          description: Patente única
          example: AB123CD
        vehicleTypeId:
          type: integer
          minimum: 1
          description: Id de un tipo de vehículo existente
          example: 1
        totalEngineHours:
          type: number
          minimum: 0
          default: 0
          description: Horas de motor acumuladas
        lastServiceHours:
          type: number
          minimum: 0
          default: 0
          description: Horas de motor en el último servicio; no puede superar las acumuladas
        status:
          $ref: '#/components/schemas/VehicleStatus'
    EvaluateThresholdRequest:
      type: object
      additionalProperties: false
      required: [totalEngineHours, lastServiceHours, intervalHours]
      properties:
        totalEngineHours:
          type: number
          minimum: 0
          example: 1850.5
        lastServiceHours:
          type: number
          minimum: 0
          description: No puede superar `totalEngineHours`
          example: 1500
        intervalHours:
          type: number
          exclusiveMinimum: true
          minimum: 0
          description: Intervalo de mantenimiento en horas (mayor a 0)
          example: 400
    ThresholdEvaluation:
      type: object
      required: [status, hoursSinceService, ratio]
      properties:
        status:
          type: string
          enum: [OK, WARNING, CRITICAL]
        hoursSinceService:
          type: number
          description: Horas desde el último servicio, redondeadas a un decimal
          example: 350.5
        ratio:
          type: number
          description: Proporción consumida del intervalo
          example: 0.8763
    SetThresholdRequest:
      type: object
      additionalProperties: false
      required: [intervalHours]
      properties:
        intervalHours:
          type: number
          exclusiveMinimum: true
          minimum: 0
          maximum: 100000
          description: Horas de uso entre servicios (mayor a 0, hasta 100000)
          example: 500
    MaintenanceThreshold:
      type: object
      required: [vehicleTypeId, intervalHours]
      properties:
        vehicleTypeId:
          type: integer
          example: 1
        intervalHours:
          type: number
          example: 500
    Operator:
      type: object
      required: [id, fullName, employeeCode, active]
      properties:
        id:
          type: integer
          example: 5
        fullName:
          type: string
          example: Juan Pérez
        employeeCode:
          type: string
          description: Legajo
          example: OP-0001
        active:
          type: boolean
    CreateOperatorRequest:
      type: object
      additionalProperties: false
      required: [fullName, employeeCode]
      properties:
        fullName:
          type: string
          minLength: 1
          maxLength: 100
          example: Juan Pérez
        employeeCode:
          type: string
          minLength: 1
          maxLength: 30
          description: Legajo único
          example: OP-0001
